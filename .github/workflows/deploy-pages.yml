# Deploys the site to GitHub Pages on every push to main.
# Enable it once: repo Settings → Pages → Source: "GitHub Actions".
# Form keys: add VITE_FORMSPREE_ID (or the VITE_EMAILJS_* values) under
# Settings → Secrets and variables → Actions → Variables.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Served from https://<user>.github.io/<repo>/ — set to "/" if you use a custom domain.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_CONTACT_PROVIDER: ${{ vars.VITE_CONTACT_PROVIDER }}
          VITE_FORMSPREE_ID: ${{ vars.VITE_FORMSPREE_ID }}
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
